# CornerMan · 本地开发依赖
# Postgres 15 + Redis 7 + MinIO（阿里云 OSS 本地替代）
# 本地 runtime 使用 Podman（开源，无需 Docker Desktop）。
# 用法：pnpm infra:up  （等价于 podman-compose -f infra/docker-compose.yml up -d）
# 文件为标准 compose，docker compose 同样可读。
services:
  postgres:
    image: postgres:15-alpine
    container_name: cornerman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cornerman
      POSTGRES_PASSWORD: cornerman
      POSTGRES_DB: cornerman
    ports:
      # 宿主机用 5433 避免与本机已存在的 postgres(5432) 冲突；容器内仍是 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cornerman-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: cornerman-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cornerman
      MINIO_ROOT_PASSWORD: cornerman123
      # 允许浏览器从 web(3000) 直传/读取（预签名 PUT/GET）。生产用具体来源白名单。
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
